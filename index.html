<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة متابعة فريق التعليق الصوتي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Cairo & Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- Firebase SDK (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0F4C3A',
                            medium: '#155D48',
                            accent: '#10B981',
                            mint: '#A3E635',
                            softMint: '#ECFDF5',
                            bgLight: '#F8FAFC',
                            border: '#D1FAE5'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        tajawal: ['Tajawal', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', 'Tajawal', sans-serif;
            background-color: #F8FAFC;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #ECFDF5;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #10B981;
            border-radius: 10px;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header Section -->
    <header class="bg-gradient-to-r from-[#0F4C3A] via-[#155D48] to-[#0F4C3A] text-white shadow-xl relative overflow-hidden">
        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#A3E635_1px,transparent_1px)] [background-size:16px_16px]"></div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 relative z-10">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                
                <!-- Logo & Title -->
                <div class="flex items-center gap-4 text-center md:text-right">
                    <div class="w-16 h-16 rounded-2xl bg-white/10 border-2 border-[#A3E635]/40 flex items-center justify-center p-2 shadow-inner">
                        <i class="fa-solid fa-microphone text-3xl text-[#A3E635]"></i>
                    </div>
                    <div>
                        <div class="inline-block px-3 py-0.5 rounded-full bg-[#A3E635]/20 text-[#A3E635] text-xs font-bold mb-1 border border-[#A3E635]/30">
                            سراة المصلحين
                        </div>
                        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">
                           منصة متابعة فريق التعليق الصوتي
                        </h1>
                        <p class="text-emerald-100 text-xs sm:text-sm font-medium flex items-center gap-2 mt-1">
                            <span id="sync-status" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 bg-amber-500/20 text-amber-200 rounded-full text-[10px] border border-amber-300/30">
                                <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
                                جاري الاتصال بالسحاب...
                            </span>
                        </p>
                    </div>
                </div>

                <!-- Stats Badges -->
                <div class="flex flex-wrap items-center justify-center gap-3">
                    <div class="bg-white/10 backdrop-blur-md px-4 py-2 rounded-xl border border-white/15 text-center">
                        <span class="block text-xs text-emerald-200">عضوات الفريق</span>
                        <span id="stat-members-count" class="text-xl font-black text-[#A3E635]">0</span>
                    </div>
                    <div class="bg-white/10 backdrop-blur-md px-4 py-2 rounded-xl border border-white/15 text-center">
                        <span class="block text-xs text-emerald-200">المجالس / المهام</span>
                        <span id="stat-polls-count" class="text-xl font-black text-[#A3E635]">0</span>
                    </div>
                </div>

            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow space-y-8">

        <!-- Controls Toolbar: Search & Add Poll Button -->
        <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4 bg-white p-4 rounded-2xl shadow-sm border border-emerald-100">
            <div class="relative flex-grow max-w-md">
                <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="search-input" oninput="handleSearch()" 
                    placeholder="ابحثي عن اسم عضوة في الفريق..." 
                    class="w-full pr-11 pl-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-[#155D48] focus:ring-2 focus:ring-[#155D48]/20 text-sm transition">
            </div>

            <button onclick="togglePollModal(true)" 
                class="bg-gradient-to-r from-[#0F4C3A] to-[#155D48] hover:from-[#155D48] hover:to-[#0F4C3A] text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-md hover:shadow-lg flex items-center justify-center gap-2 transition transform active:scale-95">
                <i class="fa-solid fa-circle-plus text-[#A3E635] text-lg"></i>
                <span>إرسال مهمة / مجلس جديد</span>
            </button>
        </div>

        <!-- Live Analytics & Statistics Dashboard -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-5">
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b border-slate-100 pb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-100 text-[#0F4C3A] flex items-center justify-center font-bold text-lg">
                        <i class="fa-solid fa-chart-pie"></i>
                    </div>
                    <div>
                        <h3 class="font-black text-slate-800 text-base">لوحة إحصائيات الحضور للمجلس المختار</h3>
                        <p class="text-xs text-slate-500">تفصيل استجابات العضوات (حضرته مباشرة / نصفه / أقل من النصف / لم أحضر)</p>
                    </div>
                </div>

                <div class="w-full sm:w-auto">
                    <select id="stats-poll-select" onchange="updateUI()" class="w-full sm:w-72 px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold focus:outline-none focus:border-[#155D48] bg-slate-50">
                        <!-- Dynamic Poll Options -->
                    </select>
                </div>
            </div>

            <!-- Stats Breakdown Grid (4 Options) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 pt-2">
                
                <!-- Direct Attendance -->
                <div class="bg-emerald-50/70 border border-emerald-200 p-4 rounded-xl space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-extrabold text-emerald-900 flex items-center gap-1.5">
                            <i class="fa-solid fa-circle-check text-emerald-600"></i> حضرته مباشرة
                        </span>
                        <span id="cnt-direct" class="text-lg font-black text-emerald-700 bg-white px-2 py-0.5 rounded-md border border-emerald-200">0</span>
                    </div>
                    <div id="list-direct" class="text-[11px] text-emerald-800 space-y-1 max-h-36 overflow-y-auto custom-scrollbar font-medium pt-1"></div>
                </div>

                <!-- Half Attendance -->
                <div class="bg-blue-50/70 border border-blue-200 p-4 rounded-xl space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-extrabold text-blue-900 flex items-center gap-1.5">
                            <i class="fa-solid fa-adjust text-blue-600"></i> حضرت نصفه
                        </span>
                        <span id="cnt-half" class="text-lg font-black text-blue-700 bg-white px-2 py-0.5 rounded-md border border-blue-200">0</span>
                    </div>
                    <div id="list-half" class="text-[11px] text-blue-800 space-y-1 max-h-36 overflow-y-auto
