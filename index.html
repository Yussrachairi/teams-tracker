<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة فرق سراة المصلحين</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Cairo & Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- Firebase SDK (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0F4C3A',      // الأخضر الزيتي الفاخر
                            medium: '#155D48',    // أخضر زمرّدي متوسط
                            accent: '#10B981',    // أخضر حيوي
                            mint: '#A3E635',      // الأخضر النعناعي المشرق
                            softMint: '#ECFDF5',  // خلفية عاجية ناعمة
                            bgLight: '#F8FAFC',   // خلفية الصفحة الفاتحة
                            border: '#D1FAE5'     // حدود ناعمة
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        tajawal: ['Tajawal', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', 'Tajawal', sans-serif;
            background-color: #F8FAFC;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #ECFDF5;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #10B981;
            border-radius: 10px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #E2E8F0;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between">

        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#A3E635_1px,transparent_1px)] [background-size:16px_16px]"></div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 relative z-10">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">

                <div class="flex items-center gap-4 text-center md:text-right">
                    <div class="w-16 h-16 rounded-2xl bg-white/10 border-2 border-[#A3E635]/40 flex items-center justify-center p-2 shadow-inner">
                        <i class="fa-solid fa-users-rays text-3xl text-[#A3E635]"></i>
                    </div>
                    <div>
                        <div class="inline-block px-3 py-0.5 rounded-full bg-[#A3E635]/20 text-[#A3E635] text-xs font-bold mb-1 border border-[#A3E635]/30">

                        </div>
                        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">

                                <span class="w-1.5 h-1.5
